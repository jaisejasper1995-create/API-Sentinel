
[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-sentinel"
version = "0.1.0"
description = "Local-first deterministic API contract validation CLI."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1"
]

[project.scripts]
api-sentinel = "api_sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["api_sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
